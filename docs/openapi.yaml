                - fileHash
                - index
                - chunk
              properties:
                fileHash:
                  type: string
                  description: 整个文件内容哈希（用于断点续传）
                index:
                  type: string
                  description: 当前分片索引（从0开始）
                chunk:
                  type: string
                  format: binary
                  description: 分片文件内容
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
