      description: 获取自己视频下的弹幕列表（需登录）
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: 每页数量
        - name: sort
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
            default: 0
          description: 排序方式（0最近 1点赞最多）
        - name: keyword
          in: query
          schema:
