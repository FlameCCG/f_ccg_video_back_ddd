  /admin/video/transcode/progress:
    get:
      tags:
        - 后台-视频管理
      summary: 查询视频转码进度（快照）
      description: |
        管理员按 videoIds 批量读取 Redis 中的转码进度快照，适合轮询兜底。
        需登录且通过 RBAC。`videoIds` 为逗号分隔 ID，最多 100 个。
      parameters:
        - name: videoIds
          in: query
          required: true
          schema:
            type: string
            example: "1,2,3"
          description: 逗号分隔的视频ID列表（最多100个）
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT（可选；本接口通常用 Authorization 头，字段与 SSE 共用同一请求结构）
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/TranscodeProgressItem"
              examples:
                success:
                  value:
                    code: 0
                    msg: ok
                    data:
                      items:
                        - videoId: 11
                          partId: 0
                          status: running
                          percent: 42.5
                          stage: multi_res
                          stagePercent: 0.6
                          message: 多分辨率转码中
                          updatedAt: "2026-07-12T10:00:00Z"
  /admin/video/transcode/progress/stream:
    get:
      tags:
        - 后台-视频管理
      summary: 订阅视频转码进度（SSE）
      description: |
        管理端通过 Server-Sent Events 订阅转码进度。服务端约每 800ms 轮询 Redis，变更时推送 `progress`/`done` 事件；
        约每 20s 发送 `heartbeat`。全部任务结束后发送 `complete` 并关闭连接。
        EventSource 无法自定义 Header 时，可通过 query `token` 传 JWT（也可走常规 Authorization）。
        长连接超时约 60 分钟，断线后客户端可重连。
      parameters:
        - name: videoIds
          in: query
          required: true
          schema:
            type: string
            example: "1,2,3"
          description: 逗号分隔的视频ID列表（最多100个）
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT（EventSource 场景；可不带 Bearer 前缀）
      responses:
        "200":
          description: 成功建立 SSE 流；建立前失败时返回标准 JSON 业务错误
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: SSE 事件流示例
                  value: |-
                    event: snapshot
                    data: {"items":[{"videoId":11,"status":"running","percent":10,"stage":"prepare","stagePercent":0.2,"updatedAt":"2026-07-12T10:00:00Z"}]}

                    event: progress
                    data: {"videoId":11,"status":"running","percent":55.0,"stage":"multi_res","stagePercent":0.5,"updatedAt":"2026-07-12T10:00:30Z"}

                    event: done
                    data: {"videoId":11,"status":"succeeded","percent":100,"stage":"cleanup","stagePercent":1,"message":"转码完成","updatedAt":"2026-07-12T10:02:00Z"}

                    event: complete
                    data: {"ok":true}
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
