  /common/ai/assets:
    get:
      tags:
        - AI
      summary: AI 资源代理（图片/视频流）
      description: |
        代理拉取上游 AI 临时资源（如生成图片/视频 URL），用于规避浏览器跨域或短链直链限制。
        无需登录。query 参数 `url` 为上游资源地址；成功时透传上游 HTTP 状态码与部分响应头，响应体为原始二进制流。
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: 上游资源完整 URL
      responses:
        "200":
          description: 代理成功，返回上游资源字节流（Content-Type 随上游）
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        "400":
          description: 参数错误或上游不可用时可能直接返回上游状态码/标准业务错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
