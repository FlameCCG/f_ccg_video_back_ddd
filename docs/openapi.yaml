    AIImageGenerationRequest:
      type: object
      description: AI图片生成请求
      required:
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        n:
          type: integer
          minimum: 1
          maximum: 10
        aspect_ratio:
          type: string
        resolution:
          type: string
          enum:
            - 1k
            - 2k
        response_format:
          type: string
          enum:
            - url
            - b64_json
        quality:
          type: string
          enum:
            - low
            - medium
            - high
        size:
          type: string
          description: 兼容尺寸字段（部分上游模型使用）
        style:
          type: string
          description: 兼容风格字段（部分上游模型使用）
        user:
          type: string
    AIImageEditRequest:
      type: object
      description: AI图片编辑请求；`image` 与 `images` 二选一
      required:
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        image:
          description: 单图 URL、base64 data URI，或 `{url,type}` 对象
          oneOf:
            - type: string
            - type: object
              properties:
                url:
                  type: string
                type:
                  type: string
        images:
          type: array
          description: 多图参考编辑，最多 10 张；元素可为 URL 字符串或 `{url,type}` 对象
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  url:
                    type: string
                  type:
                    type: string
        mask:
          type: string
          description: 遮罩图 URL 或 base64 data URI
        n:
          type: integer
          minimum: 1
          maximum: 10
        aspect_ratio:
          type: string
          description: 仅多图编辑有效
        resolution:
          type: string
          enum:
            - 1k
            - 2k
        response_format:
          type: string
          enum:
            - url
            - b64_json
        quality:
          type: string
          enum:
            - low
            - medium
            - high
        size:
          type: string
          description: 兼容尺寸字段（部分上游模型使用）
        style:
          type: string
          description: 兼容风格字段（部分上游模型使用）
        user:
          type: string
    AIVideoGenerationRequest:
      type: object
      description: AI视频生成请求；支持文生视频、图生视频、参考图视频，不包含 edit/extend
      properties:
        model:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          minimum: 1
          maximum: 15
        seconds:
          type: integer
          minimum: 1
          maximum: 15
        aspect_ratio:
          type: string
        resolution:
          type: string
          enum:
            - 480p
            - 720p
        image:
          description: 图生视频输入图 URL、base64 data URI，或 `{url,type}` 对象
          oneOf:
            - type: string
            - type: object
              properties:
                url:
                  type: string
                type:
                  type: string
        input_reference:
          description: 兼容输入引用字段
          oneOf:
            - type: string
            - type: object
              properties:
                url:
                  type: string
                type:
                  type: string
        reference_images:
          type: array
          description: 参考图视频，最多 7 张，且不能与 image/input_reference 混用
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  url:
                    type: string
                  type:
                    type: string
        generate_audio:
          type: boolean
          description: 是否生成音频（上游能力）
        camera_fixed:
          type: boolean
          description: 是否固定镜头（上游能力）
        watermark:
          type: boolean
          description: 是否加水印（上游能力）
        seed:
          type: integer
          description: 随机种子（上游能力）
        size:
          type: string
          description: 兼容尺寸字段
        output:
          type: object
          description: 上传目标等输出配置
        user:
          type: string
