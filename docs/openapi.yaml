                  value: |-
                    event: response.output_text.delta
                    data: {"type":"response.output_text.delta","delta":"图中是一只坐在沙发上的橘猫。"}

                    event: response.completed
                    data: {"type":"response.completed","response":{"id":"resp_123","status":"completed","model":"grok-4.20"}}
                video_results:
                  summary: 找视频 SSE 响应
                  value: |-
                    event: response.output_text.delta
                    data: {"type":"response.output_text.delta","delta":"[video_results]\n- [猫咪做饭](/video/11)：一只猫认真做饭，和你的需求最接近。\n- [猫咪日常合集 · P1 做饭篇](/video/12/1)：如果你想看合集里的做饭片段，可以直接点这一P。"}

                    event: response.output_text.delta
                    data: {"type":"response.output_text.delta","delta":"\n[/video_results]"}

                    event: response.completed
                    data: {"type":"response.completed","response":{"id":"resp_456","status":"completed","model":"grok-4.20"}}
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
              examples:
                failed_before_stream:
                  summary: 建立流前失败
                  value:
                    code: 1
                    data: {}
                    msg: "AI请求失败[400]: 状态码=400"
  /common/ai/responses/stream:
    get:
      tags:
        - AI
      summary: AI 文本流式输出（EventSource）
      description: 面向浏览器原生 `EventSource` 的简化 GET 流式入口。由于 `EventSource` 不能自定义请求头，登录 token 通过 query 参数传递。适合纯文本聊天和找视频场景；后端会自动包装 `text` 成用户消息，返回标准 SSE 数据流。
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: JWT token，可不带 `Bearer ` 前缀
        - name: text
          in: query
          required: false
          schema:
            type: string
          description: 用户文本；与 input 至少传一个
        - name: input
          in: query
          required: false
          schema:
            type: string
          description: URL 编码后的原始 input JSON；与 text 同时存在时优先使用 input
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: 文本模型；未传时使用后台默认值
      responses:
        "200":
          description: 成功建立流时返回 SSE；若在建立流之前失败，则返回标准 JSON 错误对象
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: EventSource 成功响应
                  value: |-
                    event: response.output_text.delta
                    data: {"type":"response.output_text.delta","delta":"[video_results]\n- [猫咪做饭](/video/11)：一只猫认真做饭，和你的需求最接近。"}

                    event: response.completed
                    data: {"type":"response.completed","response":{"id":"resp_789","status":"completed","model":"grok-4.20"}}
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
              examples:
                failed_before_stream:
                  summary: 建立流前失败
                  value:
                    code: 1
                    data: {}
                    msg: text 不能为空
