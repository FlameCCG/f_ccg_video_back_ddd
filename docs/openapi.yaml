  /common/ai/responses:
    post:
      tags:
        - AI
      summary: AI 文本生成 / 图像理解
      description: 代理 AI`/v1/responses`；当前用于文本对话与图像理解。后端会先发起一轮非流式 AI分析请求，让模型判断是否为找视频请求并返回关键词数组；关键词数组为空则不查库，直接进入第二轮正式回答。若关键词数组非空，则优先向量检索站内已发布作品（上限为 `vectorTopK`）；没有命中时回退到关键词匹配或按最新发布时间取前 `vectorTopK` 个作品。第二轮正式回答会把作品标题、描述、tags、分P标题和 `/video/:id/:p?` 路由一起注入给模型，是否输出 `video_results` 链接块由模型自主判断。服务端固定 `store=false`，且固定走 SSE，不需要前端传 `stream`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIResponsesRequest"
            examples:
              vision:
                summary: 图像理解
                value:
                  model: deepseek-v4-flash
                  thinking: true
                  thinkingEffort: high
                  input:
                    - role: user
                      content:
                        - type: input_text
                          text: 请描述图中内容并提取可见文字
                        - type: input_image
                          image_url: https://example.com/sample.png
                          detail: high
              video_search:
                summary: 找视频
                value:
                  model: deepseek-v4-flash
                  thinking: false
                  input:
                    - role: user
                      content:
                        - type: input_text
                          text: 帮我找做饭的猫咪视频
      responses:
        "200":
          description: 成功建立流时返回 SSE；若在建立流之前失败，则返回标准 JSON 错误对象
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
