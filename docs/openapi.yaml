    ChatMessage:
      type: object
      description: 私信消息
      properties:
        id:
          type: string
          description: 消息ID（ObjectID Hex）
        conversationId:
          type: string
          description: 会话ID（minUserId_maxUserId）
        senderId:
          type: integer
          format: uint
          description: 发送者用户ID
        receiverId:
          type: integer
          format: uint
          description: 接收者用户ID
        type:
          type: string
          enum:
            - text
            - image
            - emoji
            - sticker
          description: 消息类型
        text:
          type: string
          maxLength: 1000
          description: 文本内容（type=text）
        emoji:
          type: string
          description: emoji（type=emoji）
        media:
          $ref: "#/components/schemas/ChatMessageMedia"
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    ChatClientEvent:
      type: object
      description: 私信 WebSocket 客户端事件
      properties:
        type:
          type: string
          enum:
            - ping
            - send
            - read
          description: 事件类型；ping 为保活，send 为发送消息，read 为标记已读
        to:
          type: integer
          format: uint
          description: 接收方用户ID（type=send 时必填）
        msgType:
          type: string
          enum:
            - text
            - image
            - emoji
            - sticker
          description: 消息类型（type=send 时必填）
        text:
          type: string
          maxLength: 1000
          description: 文本内容（msgType=text 时必填；msgType=emoji 时可作为兼容回退字段）
        emoji:
          type: string
          description: emoji 字符（msgType=emoji 时推荐传递）
        media:
          $ref: "#/components/schemas/ChatMessageMedia"
        clientMsgId:
          type: string
          description: 客户端消息ID（type=send 时可选；用于 ack 对账和替换本地 pending 消息）
        peerId:
          type: integer
          format: uint
          description: 对方用户ID（type=read 时必填）
    ChatWSEvent:
      type: object
      description: 私信 WebSocket 服务端事件
      properties:
        type:
          type: string
          enum:
            - ack
            - message
            - read_ack
            - system
          description: 事件类型
        message:
          $ref: "#/components/schemas/ChatMessage"
        clientMsgId:
          type: string
          description: 客户端消息ID（type=ack 时返回）
        peerId:
          type: integer
          format: uint
          description: 对方用户ID（type=read_ack 时返回）
        system:
          type: string
          description: 系统提示文本（type=system 时返回）
    ChatConversationLastMessage:
      type: object
