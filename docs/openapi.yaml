      description: 动态列表图文信息
      properties:
        id:
          type: integer
          format: uint
          description: 动态ID
        content:
          type: string
          description: 动态内容
        imageUrl:
          type: string
          description: 图片URL
        likeCount:
          type: integer
          format: int64
          description: 点赞数
        commentCount:
          type: integer
          format: int64
          description: 评论数
        isLiked:
          type: boolean
          description: 当前用户是否已点赞
        isPinned:
          type: boolean
          description: 是否置顶
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          description: 置顶时间
    WorkFeedItem:
      type: object
      description: 动态流作品项（视频/动态）
      properties:
        workType:
          type: integer
          enum:
            - 1
            - 2
          description: 作品类型（1视频 2动态）
        createdAt:
          type: string
          format: date-time
          description: 发布时间
        author:
          $ref: "#/components/schemas/AuthorBrief"
        video:
          $ref: "#/components/schemas/VideoBrief"
          nullable: true
        dynamic:
          $ref: "#/components/schemas/DynamicBrief"
          nullable: true
    AdminBanRecordItem:
      type: object
      description: 管理员封禁记录
      properties:
        id:
          type: integer
          format: uint
          description: 记录ID
        userId:
          type: integer
          format: uint
          description: 被封禁用户ID
        username:
          type: string
          description: 用户名
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: 用户状态（1正常 2封禁中 3永久封禁）
        reason:
          type: string
          description: 封禁原因
        days:
          type: integer
          description: 封禁天数
        startAt:
          type: string
          format: date-time
          description: 封禁开始时间
        endAt:
          type: string
          format: date-time
          nullable: true
          description: 封禁结束时间
        operatorId:
          type: integer
          format: uint
          description: 操作人ID
        operatorUsername:
          type: string
          description: 操作人用户名
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    AdminVideoAuthor:
      type: object
      description: 管理端视频作者信息
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 头像URL
    AdminVideoItem:
      type: object
      description: 管理端视频列表项
      properties:
        id:
          type: integer
          format: uint
          description: 视频ID
        title:
          type: string
          description: 标题
        cover:
          type: string
          description: 封面
        duration:
          type: integer
          description: 时长（秒）
        views:
          type: integer
          format: int64
          description: 播放数
        likes:
          type: integer
          format: int64
          description: 点赞数
        commentCount:
          type: integer
          format: int64
          description: 评论数
        coinCount:
          type: integer
          format: int64
          description: 投币数
        favoriteCount:
          type: integer
          format: int64
          description: 收藏数
        danmuCount:
          type: integer
          format: int64
          description: 弹幕数
        isOriginal:
          type: boolean
          description: 是否原创
        storageType:
          type: string
          description: 存储类型
        status:
          type: integer
          description: 视频状态
        partitionId:
          type: integer
          format: uint
          description: 分区ID
        partitionName:
          type: string
          description: 分区名称
        author:
          $ref: "#/components/schemas/AdminVideoAuthor"
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    AdminVideoReportItem:
      type: object
      description: 管理端视频举报记录
      properties:
        id:
          type: integer
          format: uint
          description: 举报ID
        reporterUsername:
          type: string
          description: 举报人用户名
        videoId:
          type: integer
          format: uint
          description: 视频ID
        videoTitle:
          type: string
          description: 视频标题
        videoCover:
          type: string
          description: 视频封面
        reason:
          type: string
          description: 举报原因
        detail:
          type: string
          description: 举报详情
        imageUrls:
          type: array
          items:
            type: string
          description: 证据图片
        status:
          type: integer
          description: 处理状态
        handleNote:
          type: string
          description: 处理说明
        handledBy:
          type: integer
          format: uint
          description: 处理人ID
        handledAt:
          type: string
          format: date-time
          nullable: true
          description: 处理时间
        createdAt:
          type: string
          format: date-time
          description: 举报时间
    AdminDanmuReportItem:
      type: object
      description: 管理端弹幕举报记录
      properties:
        id:
          type: integer
          format: uint
          description: 举报ID
        reporterUsername:
          type: string
          description: 举报人用户名
        videoId:
          type: integer
          format: uint
          description: 视频ID
        videoTitle:
          type: string
          description: 视频标题
        videoCover:
          type: string
          description: 视频封面
        danmuId:
          type: integer
          format: uint
          description: 弹幕ID
        danmuContent:
          type: string
          description: 弹幕内容
        reason:
          type: string
          description: 举报原因
        detail:
          type: string
          description: 举报详情
        status:
          type: integer
          description: 处理状态
        handleNote:
          type: string
          description: 处理说明
        handledBy:
          type: integer
          format: uint
          description: 处理人ID
        handledAt:
          type: string
          format: date-time
          nullable: true
          description: 处理时间
        createdAt:
          type: string
          format: date-time
          description: 举报时间
    UserGlobalNotification:
      type: object
      description: 用户全局通知（列表返回结构）
      properties:
        id:
          type: integer
          format: uint
          description: 通知ID
        type:
          type: integer
          description: 通知类型
        receiverID:
          type: integer
          description: 接收者用户ID（-1表示全员）
        actionUserID:
          type: integer
          format: uint
          description: 操作用户ID
        actionUserAvatar:
          type: string
          description: 操作用户头像
        actionUserName:
          type: string
          description: 操作用户名
        title:
          type: string
          description: 通知标题
        content:
          type: string
          description: 通知内容
        link:
          type: string
          description: 外部链接
        videoID:
          type: integer
          format: uint
          description: 视频ID
        videoTitle:
          type: string
          description: 视频标题
        dynamicID:
          type: integer
          format: uint
          description: 动态ID
        commentID:
          type: integer
          format: uint
          description: 评论ID
        isRead:
          type: boolean
          description: 是否已读
    TranscodeProgressItem:
      type: object
      description: 管理端可见的视频转码进度（Redis 快照）
      properties:
        videoId:
          type: integer
          format: uint
          description: 视频ID
        partId:
          type: integer
          format: uint
          description: 分P ID（无分P时可省略或为0）
        status:
          type: string
          description: 任务状态
          enum:
            - queued
            - running
            - succeeded
            - failed
        percent:
          type: number
          format: double
          description: 整体进度百分比（0-100）
        stage:
          type: string
          description: 当前阶段（queued/prepare/probe/save_original/normalize/multi_res/dash/cleanup 等）
        stagePercent:
          type: number
          format: double
          description: 当前阶段进度（0-1）
        message:
          type: string
          description: 人类可读状态说明
        durationSec:
          type: integer
          description: 源时长（秒，可选）
        outTimeSec:
          type: number
          format: double
          description: FFmpeg 已处理时长（秒，可选）
        error:
          type: string
          description: 失败原因（仅 failed 时）
        updatedAt:
          type: string
          format: date-time
          description: 进度更新时间
        startedAt:
          type: string
          format: date-time
          description: 任务开始时间（可选）
paths:
  /common/user/register/email:
    post:
      tags:
        - 用户管理
      summary: 邮箱注册
      description: 通过邮箱注册新用户；滑块验证码在发送邮箱验证码阶段校验，注册阶段仅校验邮箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      msg:
                        example: 注册成功
  /common/user/login/pwd:
    post:
      tags:
        - 用户管理
      summary: 用户名密码登录
      description: 使用用户名/邮箱和密码登录，需要先通过点击验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - captchaToken
                - captchaDots
              properties:
                username:
                  type: string
                  description: 用户名或邮箱
                  example: testuser
                password:
                  type: string
                  description: 密码
                  example: password123
                captchaToken:
                  type: string
                  description: 点击验证码token（来自 /common/captcha/click）
                captchaDots:
                  type: array
                  description: 点击点位列表（按顺序）
                  items:
                    $ref: "#/components/schemas/ClickCaptchaPoint"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/qq:
    post:
      tags:
        - 用户管理
      summary: QQ登录
      description: 使用QQ授权码登录，未注册用户会自动注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: QQ授权码
                  example: abc123
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/google:
    post:
      tags:
        - 用户管理
      summary: Google登录
      description: 使用Google授权码登录，未注册用户会自动注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Google授权码
                  example: abc123
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/github:
    post:
      tags:
        - 用户管理
      summary: GitHub登录
      description: 使用GitHub授权码登录，未注册用户会自动注册；需回传与获取登录URL时一致的 state，支持可选 PKCE codeVerifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                  description: GitHub授权码
                  example: abc123
                state:
                  type: string
                  description: GitHub登录流程中的 state；后端会校验并一次性消费
                  example: github-state
                codeVerifier:
                  type: string
                  description: PKCE codeVerifier，若生成登录URL时传了 codeChallenge 则需要回传
                  example: verifier123
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/linuxdo:
    post:
      tags:
        - 用户管理
      summary: LinuxDo登录
      description: 使用 LinuxDo 授权码登录，未注册用户会自动注册；需回传与获取登录URL时一致的 state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                  description: LinuxDo 授权码
                  example: abc123
                state:
                  type: string
                  description: LinuxDo 登录流程中的 state；后端会校验并一次性消费
                  example: linuxdo-state
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/x:
    post:
      tags:
        - 用户管理
      summary: X登录
      description: 使用X授权码登录，未注册用户会自动注册；需回传与获取登录URL时一致的 state，并配合 PKCE 的 codeVerifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
                - codeVerifier
              properties:
                code:
                  type: string
                  description: X授权码
                  example: abc123
                state:
                  type: string
                  description: X登录流程中的 state；后端会校验并一次性消费
                  example: x-state
                codeVerifier:
                  type: string
                  description: X PKCE codeVerifier
                  example: verifier123
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/login/refresh:
    post:
      tags:
        - 用户管理
      summary: 刷新访问令牌
      description: 使用 refreshToken 刷新访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 刷新令牌
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JwtToken"
  /common/user/search:
    get:
      tags:
        - 用户管理
      summary: 搜索用户
      description: 根据关键词搜索用户
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
        - name: userSort
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
            default: 0
          description: 排序方式（0相关性 1粉丝数 2等级 3注册时间）
        - name: userOrder
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
            default: 0
          description: 排序顺序（0降序 1升序）
      responses:
        "200":
          description: 搜索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserSearchResult"
  /common/user/detail:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      description: 根据用户ID获取用户公开信息
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: 用户ID
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserDetail"
  /common/user/info:
    get:
      tags:
        - 用户管理
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息（需登录）
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserInfo"
    put:
      tags:
        - 用户管理
      summary: 更新用户信息
      description: 更新当前登录用户的信息（需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名（可选）
                avatar:
                  type: string
                  description: 头像URL（可选）
                description:
                  type: string
                  description: 个人简介（可选）
                gender:
                  type: integer
                  description: 性别（0未知 1男 2女）（可选）
                birthday:
                  type: string
                  description: 生日（YYYY-MM-DD格式）（可选）
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      msg:
                        example: 更新成功
  /common/user/email/bind:
    post:
      tags:
        - 用户管理
      summary: 绑定邮箱
      description: 绑定邮箱（需登录，邮箱验证码类型3）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailID
                - emailCode
                - email
              properties:
                emailID:
                  type: string
                  description: 邮箱验证码ID
                emailCode:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      msg:
                        example: 绑定成功
  /common/user/password/reset:
    post:
      tags:
        - 用户管理
      summary: 忘记密码重置
      description: 通过邮箱验证码重置密码（验证码类型2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailID
                - emailCode
                - email
                - newPassword
              properties:
                emailID:
                  type: string
                  description: 邮箱验证码ID
                emailCode:
                  type: string
                  description: 邮箱验证码
                email:
                  type: string
                  description: 邮箱
                newPassword:
                  type: string
                  description: 新密码
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      msg:
                        example: 重置成功
  /common/user/password/change:
    put:
      tags:
        - 用户管理
      summary: 修改密码
      description: 修改当前用户密码（需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  description: 旧密码
                newPassword:
                  type: string
                  description: 新密码
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      msg:
                        example: 修改成功
  /common/user/info/conf:
    get:
      tags:
        - 用户管理
      summary: 获取用户配置
      description: 获取当前登录用户的隐私配置（需登录）
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
    put:
      tags:
        - 用户管理
      summary: 更新用户配置
      description: 更新当前登录用户的隐私配置（需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openCollect:
                  type: boolean
                  description: 是否公开收藏（可选）
                openFans:
                  type: boolean
                  description: 是否公开粉丝（可选）
                openFollow:
                  type: boolean
                  description: 是否公开关注（可选）
                openLikeVideo:
                  type: boolean
                  description: 是否公开点赞视频（可选）
                openCoinVideo:
                  type: boolean
                  description: 是否公开投币视频（可选）
                bannerId:
                  type: integer
                  format: uint
                  minimum: 1
