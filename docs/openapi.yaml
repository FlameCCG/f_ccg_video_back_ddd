openapi: 3.0.3
info:
  title: CCG Video Backend API
  description:
    "视频平台后端 API 文档，包含用户、视频、评论、社交、通知、动态、RBAC 等模块。

    说明：

    - 所有接口统一返回 HTTP 200，业务成功/失败请以响应体 code 判断（0=成功，1=失败），错误信息在 msg。

    - 管理后台接口除登录鉴权外还会经过 RBAC（Casbin）权限校验。"
  version: 1.0.0
servers:
  - url: /v1
tags:
  - name: 用户管理
    description: 注册登录、用户信息、设置、记录
  - name: 验证码管理
    description: 图形/滑块/点击/邮箱验证码获取与校验
  - name: 站点管理
    description: 站点配置与统计、心跳/打点
  - name: 轮播图管理
    description: 轮播图获取与展示
  - name: 社交管理
    description: 关注/粉丝/关系链
  - name: 视频管理
    description: 视频浏览、搜索、互动、投稿、上传、弹幕、收藏/历史
  - name: 评论管理
    description: 评论、回复与互动
  - name: 私信管理
    description: 私信/聊天相关
  - name: 通知管理
    description: 通知与消息
  - name: 动态管理
    description: 动态发布与列表
  - name: AI
    description: AI 文本/图像/视频能力代理与资源代理
  - name: 权限管理
    description: 角色、菜单、权限与资源同步
  - name: 后台-用户管理
    description: 用户封禁与后台管理
  - name: 后台-站点管理
    description: 站点统计与配置管理
  - name: 后台-轮播图管理
    description: 轮播图管理
  - name: 后台-视频管理
    description: 视频审核、举报、分区管理
  - name: 后台-评论管理
    description: 评论管理
  - name: 后台-通知管理
    description: 通知管理
  - name: 后台-动态管理
    description: 动态管理
components:
  schemas:
    Response:
      type: object
      description: 通用响应结构（HTTP 200 + 业务码 code）
      properties:
        code:
          type: integer
          description: 响应码，0表示成功，1表示失败
          example: 0
        data:
          description: 响应数据
        msg:
          type: string
          description: 响应消息
          example: ok
      required:
        - code
        - data
        - msg
    ListResponse:
      type: object
      description: 分页列表响应结构（HTTP 200 + 业务码 code）
      properties:
        code:
          type: integer
          description: 响应码
          example: 0
        data:
          type: object
          properties:
            list:
              type: array
              items: {}
              description: 数据列表
            total:
              type: integer
              format: int64
              description: 总数
        msg:
          type: string
          example: 成功
    JwtToken:
      type: object
      description: JWT令牌
      properties:
        accessToken:
          type: string
          description: 访问令牌
        refreshToken:
          type: string
          description: 刷新令牌
    ClickCaptchaPoint:
      type: object
      description: 点击验证码坐标点
      properties:
        index:
          type: integer
          description: 点击顺序索引（从0开始）
        x:
          type: integer
          description: 点击的X坐标
        y:
          type: integer
          description: 点击的Y坐标
      required:
        - index
        - x
        - y
    UserInfo:
      type: object
      description: 当前登录用户信息
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        email:
          type: string
          description: 邮箱
        avatar:
          type: string
          description: 头像URL
        bannerUrl:
          type: string
          description: 用户主页横幅URL
        description:
          type: string
          description: 个人简介
        gender:
          type: integer
          description: 性别（0未知 1男 2女）
        birthday:
          type: string
          description: 生日（YYYY-MM-DD格式）
        level:
          type: integer
          description: 用户等级
        exp:
          type: integer
          format: int64
          description: 经验值
        coinCount:
          type: number
          format: double
          description: 硬币数量（支持1位小数）
        followCount:
          type: integer
          format: int64
          description: 关注数
        fansCount:
          type: integer
          format: int64
          description: 粉丝数
        dynamicCount:
          type: integer
          format: int64
          description: 动态数量
        registerSource:
          type: string
          description: 注册来源
        likeTags:
          type: array
          items:
            type: string
          description: 用户兴趣标签列表
        hasPassword:
          type: boolean
          description: 是否已设置登录密码（第三方首次登录可能为 false；修改密码时据此决定是否校验旧密码）
        isThirdParty:
          type: boolean
          description: 是否绑定第三方登录（OpenID 非空）
    AdminUserInfo:
      type: object
      description: 后台当前登录用户信息
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        email:
          type: string
          description: 邮箱
        avatar:
          type: string
          description: 头像URL
        description:
          type: string
          description: 个人简介
        gender:
          type: integer
          description: 性别（0未知 1男 2女）
        birthday:
          type: string
          description: 生日（YYYY-MM-DD格式）
        level:
          type: integer
          description: 用户等级
        exp:
          type: integer
          format: int64
          description: 经验值
        coinCount:
          type: number
          format: double
          description: 硬币数量（支持1位小数）
        followCount:
          type: integer
          format: int64
          description: 关注数
        fansCount:
          type: integer
          format: int64
          description: 粉丝数
        dynamicCount:
          type: integer
          format: int64
          description: 动态数量
        currentRoleID:
          type: integer
          format: uint
          description: 当前角色ID
        registerSource:
          type: string
          description: 注册来源
        roleNames:
          type: array
          description: 角色名列表
          items:
            type: string
    AdminUserListItem:
      type: object
      description: 管理员用户列表项
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        email:
          type: string
          description: 邮箱
        avatar:
          type: string
          description: 头像URL
        status:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: 状态（1正常 2封禁 3永久封禁）
        level:
          type: integer
          description: 用户等级
        exp:
          type: integer
          format: int64
          description: 经验值
        coinCount:
          type: number
          format: double
          description: 硬币数量（支持1位小数）
        currentRoleId:
          type: integer
          format: uint
          description: 当前角色ID
        registerSource:
          type: string
          description: 注册来源
        roleNames:
          type: array
          description: 角色名列表
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: 注册时间
    UserDetail:
      type: object
      description: 用户公开信息
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 头像URL
        bannerUrl:
          type: string
          description: 用户主页横幅URL
        description:
          type: string
          description: 个人简介
        gender:
          type: integer
          description: 性别（0未知 1男 2女）
        birthday:
          type: string
          description: 生日（YYYY-MM-DD格式）
        level:
          type: integer
          description: 用户等级
        exp:
          type: integer
          format: int64
          description: 经验值
        followCount:
          type: integer
          format: int64
          description: 关注数
        fansCount:
          type: integer
          format: int64
          description: 粉丝数
        totalLikes:
          type: integer
          format: int64
          description: 获赞总数
        totalViews:
          type: integer
          format: int64
          description: 播放总数
    VideoItem:
      type: object
      description: 视频项
      properties:
        id:
          type: integer
          format: uint
          description: 视频ID
        title:
          type: string
          description: 视频标题
        description:
          type: string
          description: 视频描述
        cover:
          type: string
          description: 封面URL
        authorUsername:
          type: string
          description: 作者用户名
        author:
          $ref: "#/components/schemas/VideoAuthorBrief"
        duration:
          type: number
          format: float
          description: 视频时长（秒；转码消费者探测后更新，分P为合计）
        views:
          type: integer
          format: int64
          description: 播放量
        likes:
          type: integer
          format: int64
          description: 点赞数
        commentCount:
          type: integer
          format: int64
          description: 评论数
        coinCount:
          type: integer
          format: int64
          description: 投币数
        favoriteCount:
          type: integer
          format: int64
          description: 收藏数
        danmuCount:
          type: integer
          format: int64
          description: 弹幕数
        isOriginal:
          type: boolean
          description: 是否原创
        storageType:
          type: string
          description: 存储类型（Local/Minio）
        status:
          type: integer
          description: 视频状态
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        partition:
          $ref: "#/components/schemas/Partition"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/VideoResourceItem"
          description: 视频资源列表（转码任务开始后先写入源资源，转码完成后补齐清晰度）
        parts:
          type: array
          items:
            $ref: "#/components/schemas/VideoPartItem"
          description: 分P列表（转码任务开始后回填时长与资源）
        isLiked:
          type: boolean
          description: 是否已点赞
        isFavorited:
          type: boolean
          description: 是否已收藏
        isCoined:
          type: boolean
          description: 是否已投币
    VideoAuthorBrief:
      type: object
      description: 视频作者信息
      properties:
        id:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 头像URL
        level:
          type: integer
          description: 用户等级
        description:
          type: string
          description: 个人简介
    VideoResourceItem:
      type: object
      description: 视频资源项
      properties:
        id:
          type: integer
          format: uint
          description: 资源ID
        resolution:
          type: string
          description: 清晰度标识（如 1080p 高清）
        sourceFileName:
          type: string
          description: 源文件名
        fileUrl:
          type: string
          description: 资源URL
        fileSize:
          type: integer
          format: int64
          description: 文件大小
        bitrate:
          type: integer
          description: 码率
        format:
          type: string
          description: 容器格式
        codec:
          type: string
          description: 视频编码
        isVip:
          type: boolean
          description: 是否会员资源
        isSource:
          type: boolean
          description: 是否源文件
    VideoPartItem:
      type: object
      description: 分P信息
      properties:
        id:
          type: integer
          format: uint
          description: 分P ID
        title:
          type: string
          description: 分P标题
        sortOrder:
          type: integer
          description: 分P排序
        duration:
          type: integer
          description: 分P时长（秒，转码消费者探测后更新）
        danmuCount:
          type: integer
          format: int64
          description: 分P弹幕数
        resources:
          type: array
          items:
            $ref: "#/components/schemas/VideoResourceItem"
    SearchHighlight:
      type: object
      description: 搜索高亮字段
      additionalProperties:
        type: array
        items:
          type: string
    SearchVideoHit:
      type: object
      description: 视频搜索结果项
      properties:
        id:
          type: integer
          format: uint
        title:
          type: string
        cover:
          type: string
        authorUsername:
          type: string
        createdAt:
          type: string
          format: date-time
        highlight:
          $ref: "#/components/schemas/SearchHighlight"
        views:
          type: integer
          format: int64
        danmuCount:
          type: integer
          format: int64
        duration:
          type: integer
        tags:
          type: array
          items:
            type: string
    SearchUserHit:
      type: object
      description: 用户搜索结果项
      properties:
        id:
          type: integer
          format: uint
        username:
          type: string
        avatar:
          type: string
        highlight:
          $ref: "#/components/schemas/SearchHighlight"
        level:
          type: integer
        followerCount:
          type: integer
          format: int64
    SuggestionItem:
      type: object
      description: 搜索建议项
      properties:
        value:
          type: string
          description: 建议文本
        highlight:
          type: string
          description: 高亮文本（使用 <em> 包裹匹配前缀）
        docType:
          type: string
          description: 类型标签
          enum:
            - videos
            - users
            - tags
      required:
        - value
        - highlight
        - docType
    HotKeywordItem:
      type: object
      description: 首页热搜关键词项
      properties:
        keyword:
          type: string
          description: 热搜关键词
        score:
          type: integer
          format: int64
          description: 关键词热度分值/累计次数
      required:
        - keyword
        - score
    VideoSearchResult:
      type: object
      description: 视频搜索结果
      properties:
        videoTotal:
          type: integer
          format: int64
        userTotal:
          type: integer
          format: int64
        videos:
          type: array
          items:
            $ref: "#/components/schemas/SearchVideoHit"
    UserSearchResult:
      type: object
      description: 用户搜索结果
      properties:
        userTotal:
          type: integer
          format: int64
        users:
          type: array
          items:
            $ref: "#/components/schemas/SearchUserHit"
    CommentItem:
      type: object
      description: 评论项
      properties:
        id:
          type: integer
          format: uint
          description: 评论ID
        content:
          type: string
          description: 评论内容
        userId:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 用户头像
        videoId:
          type: integer
          format: uint
          description: 视频ID
        dynamicId:
          type: integer
          format: uint
          description: 动态ID
        videoTitle:
          type: string
          description: 关联视频标题（可选）
        videoCover:
          type: string
          description: 关联视频封面（可选）
        parentId:
          type: integer
          format: uint
          nullable: true
          description: 父评论ID
        rootId:
          type: integer
          format: uint
          nullable: true
          description: 根评论ID
        atUserIds:
          type: array
          items:
            type: integer
            format: uint
          description: "@的用户ID列表"
        pictures:
          type: array
          items:
            type: string
          description: 评论附带图片 URL 列表
        likeCount:
          type: integer
          format: int64
          description: 点赞数
        replyCount:
          type: integer
          format: int64
          description: 回复数
        isPinned:
          type: boolean
          description: 是否置顶
        pinnedAt:
          type: string
          format: date-time
          description: 置顶时间
        commenterAddr:
          type: string
          description: 评论者归属地
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        isLiked:
          type: boolean
          description: 当前用户是否已点赞
        replyTo:
          type: object
          nullable: true
          description: 回复对象信息（楼中楼）
          properties:
            userId:
              type: integer
              format: uint
            username:
              type: string
    DanmuItem:
      type: object
      description: 弹幕项
      properties:
        id:
          type: integer
          format: uint
          description: 弹幕ID
        videoId:
          type: integer
          format: uint
          description: 视频ID
        videoPartId:
          type: integer
          format: uint
          description: 分P ID（单视频为 0）
        userId:
          type: integer
          format: uint
          description: 用户ID
        content:
          type: string
          description: 弹幕内容
        timeOffset:
          type: integer
          description: 视频时间偏移（毫秒）
        color:
          type: string
          description: 弹幕颜色
        fontSize:
          type: integer
          description: 字体大小
        position:
          type: integer
          description: 弹幕位置（0滚动 1顶部 2底部）
        likeCount:
          type: integer
          format: int64
          description: 点赞数
        isLiked:
          type: boolean
          description: 当前用户是否已点赞
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    CreatorDanmuItem:
      type: object
      description: 创作者弹幕项
      properties:
        id:
          type: integer
          format: uint
          description: 弹幕ID
        userId:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 用户头像
        videoId:
          type: integer
          format: uint
          description: 视频ID
        videoTitle:
          type: string
          description: 视频标题
        videoCover:
          type: string
          description: 视频封面
        videoPartId:
          type: integer
          format: uint
          description: 分P ID
        content:
          type: string
          description: 弹幕内容
        timeOffset:
          type: integer
          description: 弹幕时间偏移(秒)
        color:
          type: string
          description: 弹幕颜色
        fontSize:
          type: integer
          description: 字体大小
        position:
          type: integer
          description: 弹幕位置（0滚动 1顶部 2底部）
        likeCount:
          type: integer
          format: int64
          description: 点赞数
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    AdminDanmuItem:
      type: object
      description: 管理员弹幕项
      properties:
        id:
          type: integer
          format: uint
          description: 弹幕ID
        userId:
          type: integer
          format: uint
          description: 用户ID
        username:
          type: string
          description: 用户名
        avatar:
          type: string
          description: 用户头像
        videoId:
          type: integer
          format: uint
          description: 视频ID
        videoTitle:
          type: string
          description: 视频标题
        videoCover:
          type: string
          description: 视频封面
        videoPartId:
          type: integer
          format: uint
          description: 分P ID
        content:
          type: string
          description: 弹幕内容
        timeOffset:
          type: integer
          description: 弹幕时间偏移(秒)
        color:
          type: string
          description: 弹幕颜色
        fontSize:
          type: integer
          description: 字体大小
        position:
          type: integer
          description: "位置: 0-滚动 1-顶部 2-底部"
        likeCount:
          type: integer
          format: int64
          description: 点赞数
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    FolderItem:
      type: object
      description: 收藏夹项
      properties:
        id:
          type: integer
          format: uint
          description: 收藏夹ID
        name:
          type: string
          description: 收藏夹名称
        isDefault:
          type: boolean
          description: 是否为默认收藏夹
        videoCount:
          type: integer
          description: 视频数量
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    NotificationItem:
      type: object
      description: 通知项
      properties:
        id:
          type: integer
          format: uint
          description: 通知ID
        type:
          type: integer
          description: 通知类型
        title:
          type: string
          description: 通知标题
        content:
          type: string
          description: 通知内容
        dynamicID:
          type: integer
          format: uint
          description: 动态ID
        isRead:
          type: boolean
          description: 是否已读
        createdAt:
          type: string
          format: date-time
          description: 创建时间
    NotificationCountSummary:
      type: object
      description: 未读通知数量统计
      properties:
        reply:
          type: integer
          format: int64
          description: 未读回复通知数量
        like:
          type: integer
          format: int64
          description: 未读点赞通知数量
        at:
          type: integer
          format: int64
          description: 未读@我通知数量
        system:
          type: integer
          format: int64
          description: 未读系统通知数量
        message:
          type: integer
          format: int64
          description: 未读私信总数
    ChatMessageMedia:
      type: object
      description: 私信媒体（图片/表情包）
      properties:
        url:
          type: string
          description: 资源URL
        mime:
          type: string
          description: MIME类型
        width:
