  /common/video/danmu/history:
    get:
      tags:
        - 视频管理
      summary: 历史弹幕
      description: 获取指定时间段的历史弹幕
      parameters:
        - name: videoId
          in: query
          required: true
          schema:
            type: integer
          description: 视频ID
        - name: partId
          in: query
          schema:
            type: integer
            minimum: 1
          description: 分P ID（分P视频必填）
        - name: start
          in: query
          schema:
            type: integer
            minimum: 0
          description: 开始时间偏移（毫秒）
        - name: end
          in: query
          schema:
            type: integer
            minimum: 0
          description: 结束时间偏移（毫秒）
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: 返回数量上限
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/DanmuItem"
  /common/video/danmu/room/list:
    get:
      tags:
        - 视频管理
      summary: 弹幕列表
      description: 获取房间弹幕列表；传 start/end 时按播放时间分段返回（按 timeOffset 升序）；不传 start/end 时为历史弹幕，按 createdAt 降序固定返回最近 500 条
      parameters:
        - name: videoId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: 视频ID
        - name: partId
          in: query
          schema:
            type: integer
            minimum: 1
          description: 分P ID（分P视频必填）
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 50
          description: 每页数量；分段模式最多 5000、默认 3000；历史弹幕（不传 start/end）忽略该参数，固定返回最近 500 条
        - name: start
          in: query
          schema:
            type: integer
            minimum: 0
          description: 播放时间起点（毫秒，含）；与 end 配合使用
        - name: end
          in: query
          schema:
            type: integer
            minimum: 0
          description: 播放时间终点（毫秒，不含）；end - start 最大 60000
        - name: date
          in: query
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: 日期筛选（YYYY-MM-DD格式，可选）；历史弹幕模式表示查询该日期当天及更早的弹幕，分段模式表示限定在该日期当天
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: "#/components/schemas/DanmuItem"
                          total:
                            type: integer
                            format: int64
                          returned:
                            type: integer
                            description: 分段模式返回数量
                          truncated:
                            type: boolean
                            description: 分段模式是否因 pageSize 截断
                          start:
                            type: integer
                            description: 分段模式播放时间起点（毫秒，含）
                          end:
                            type: integer
                            description: 分段模式播放时间终点（毫秒，不含）
