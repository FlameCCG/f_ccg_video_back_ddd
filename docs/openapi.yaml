  /common/video/publish:
    post:
      tags:
        - 视频管理
      summary: 发布视频
      description: 发布新视频（需登录；支持单文件与分P投稿）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PublishVideoSingleReq"
                - $ref: "#/components/schemas/PublishVideoMultiPartReq"
      responses:
        "200":
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          videoId:
                            type: integer
                            description: 视频ID
                          status:
                            type: integer
                            description: 视频状态（1已发布 2私密 4审核中）
                          publishTime:
                            type: string
                            format: date-time
                            description: 发布时间
                          cover:
                            type: string
                            description: 封面URL
    put:
      tags:
        - 视频管理
      summary: 更新视频
      description: 更新已发布的视频信息（需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - videoId
              properties:
                videoId:
                  type: integer
                  description: 视频ID
                title:
                  type: string
                  maxLength: 200
                  description: 视频标题（可选）
                description:
                  type: string
                  maxLength: 5000
                  description: 视频描述（可选）
                partitionId:
                  type: integer
                  description: 分区ID（可选）
                tags:
                  type: array
                  items:
                    type: integer
                  maxItems: 10
                  description: 标签ID列表（可选）
                isOriginal:
                  type: boolean
                  description: 是否原创（可选）
                isPrivate:
                  type: boolean
                  description: 是否私密（可选；传 true 转为私密，传 false 转为公开/审核中）
                coverUrl:
                  type: string
                  description: 封面图片URL（可选）
                publishTime:
                  type: string
                  format: date-time
                  description: 发布时间（可选）
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Response"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VideoItem"
  /common/video/upload/chunk:
