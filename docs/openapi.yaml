                  type: boolean
                  description: 是否显示
                type:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                  description: 轮播图类型（1首页/分区轮播图 2顶部横幅 3用户主页横幅）
                partitionId:
                  type: integer
                  format: uint
                  description: 分区ID，仅type=1时生效；0代表首页，>0代表对应分区
