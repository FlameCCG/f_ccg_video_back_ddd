                          completed:
                            type: boolean
                            description: 是否已完整上传完成，可用于秒传判断
                          filePath:
                            type: string
                            description: 已完成上传时的最终文件路径
                          uploadedChunks:
                            type: array
                            items:
                              type: string
                            description: 未完成上传时已存在的分片索引列表
