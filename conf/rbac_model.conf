# 请求鉴权三元组与数据库角色/菜单是不同模型。
# sub 来自认证后的 user:<id>，obj 优先使用 Gin 路由模板，act 是 HTTP 方法。
[request_definition]
r = sub, obj, act

# 策略定义：某用户主体或角色可在什么路径执行哪种动作。
[policy_definition]
p = sub, obj, act

# g 同时保存用户到角色、角色到父角色的继承边；user: 前缀用来区分用户主体。
[role_definition]
g = _, _

# 存在任一匹配的允许策略即通过；这里没有独立的 deny 优先规则。
[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 全部接口为静态路径 + query/body 传参后，用 globMatch 即可：
# - 精确路径：/v1/admin/rbac/role
# - 通配：/v1/admin/** 或 /v1/admin/rbac/*
m = g(r.sub, p.sub) && globMatch(r.obj, p.obj) && (r.act == p.act || p.act == "*")
