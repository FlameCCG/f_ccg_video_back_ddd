services:
  mysql:
    image: mysql:8.0 # 使用官方 MySQL 8.0 镜像
    container_name: mysql
    environment:
      TZ: Asia/Shanghai # 时区
      MYSQL_ROOT_PASSWORD: 123456 # root 密码（生产勿用弱口令）
      MYSQL_DATABASE: f_ccg_video # 初始化创建数据库
    restart: on-failure # 失败自动重启
    volumes:
      - ./components/mysql/my.cnf:/etc/mysql/my.cnf # 自定义 my.cnf 挂载
      - ./components/mysql/data:/var/lib/mysql
    ports:
      - "3307:3306" # 暴露 MySQL 端口
    command: # 自定义启动参数
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    networks:
      - f_video_network
  redis:
    image: redis:7.0
    container_name: redis
    restart: unless-stopped # 除非手动停止，否则自动重启
    command: # 以数组形式传参更直观
      [
        "redis-server",
        "--bind",
        "0.0.0.0", # 允许容器内网络访问
        "--appendonly",
        "yes", # 开启 AOF 持久化（默认写 /data/appendonly.aof）
        "--requirepass",
        "123456", # 访问密码（生产勿用弱口令）
      ]
    ports:
      - "6380:6379"
    # AOF/RDB 默认目录为 /data；挂宿主机目录避免容器重建丢数据。
    # 备份建议：定期拷贝 ./components/redis/data（或 redis-cli BGSAVE + 复制 dump/AOF），勿直接热拷非原子文件。
    volumes:
      - ./components/redis/data:/data
    networks:
      - f_video_network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    restart: unless-stopped
    container_name: elasticsearch
    environment:
      - ES_JAVA_OPTS=-Xms2g -Xmx2g # JVM 堆大小
      - discovery.type=single-node # 单节点集群
      - xpack.security.enabled=false # 关闭 X-Pack 安全插件
    ports:
      - "9200:9200"
    volumes:
      - ./components/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./components/elasticsearch/data:/usr/share/elasticsearch/data
      - ./components/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - f_video_network
  # logstash:
  #   image: docker.elastic.co/logstash/logstash:8.12.2
  #   restart: on-failure # 当前 pipeline 使用 stdin 占位，正常退出时不应被无限拉起
  #   container_name: logstash
  #   depends_on: [kafka, elasticsearch]
  #   environment:
  #     - LS_JAVA_OPTS=-Xms512m -Xmx512m
